<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis XV Años</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<header class="hero">
    <img src="img/portada.jpg" class="hero-img" alt="Portada">

    <div class="overlay">
        <h1>Mis XV Años</h1>
        <h2>Nombre de la Quinceañera<br>Cuerva</h2>
        <p>Sábado 15 de Agosto de 2026</p>
    </div>
</header>

<section>
    <h2>Con la bendición de Dios y de mis padres</h2>

    <p>
        Padres:<br>
        Cuervo<br>
        Cuervoña
    </p>
</section>

<section>
    <img src="cuervo sf.png" alt="decoracion"> 
</section>

<section>
    <h2>Ceremonia</h2>

    <p>
        Parroquia 20 F<br>
        5:00 PM
    </p>
</section>

<section>
    <h2>Recepción</h2>

    <p>
        Salón ITNL<br>
        7:00 PM
    </p>
</section>

<section>
    <h2>Ubicación</h2>

    <a class="boton"
       href="https://www.google.com/maps/search/itnl/@25.6641972,-100.2466487,17z/data=!3m1!4b1?entry=ttu&g_ep=EgoyMDI2MDkyNy4xIKXMDSoASAFQAw%3D%3D"
    
       target="_blank">
        Ver en Google Maps
    </a>
</section>

<section>

    <h2>Confirma tu asistencia</h2>

    <form id="formulario">

        <input
            id="nombre"
            type="text"
            name="nombre"
            placeholder="Nombre"
            required>

        <input
            id="personas"
            type="number"
            name="personas"
            placeholder="Número de personas"
            required>

        <input
            id="telefono"
            type="tel"
            name="telefono"
            placeholder="Teléfono">

        <button type="submit">
            Confirmar asistencia
        </button>

    </form>

    <p id="respuesta"></p>

</section>

<script src="script.js"></script>

</body>
</html>
